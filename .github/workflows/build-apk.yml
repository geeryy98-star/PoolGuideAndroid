
name: Build Pool Guide APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          set -e
          mkdir -p source
          unzip PoolGuideAndroid-prototype-0.1.zip -d source

      - name: Preparar carpeta de codigo
        run: |
          mkdir -p source/PoolGuideAndroid/app/src/main/java/com/example/poolguide

      - name: Copiar archivos principales
        run: |
          set -e
          DEST="source/PoolGuideAndroid/app/src/main/java/com/example/poolguide"

          cp PoolGuideAndroid/app/src/main/java/com/example/poolguide/MainActivity.kt "$DEST/"
          cp PoolGuideAndroid/app/src/main/java/com/example/poolguide/ScreenCaptureService.kt "$DEST/"
          cp PoolGuideAndroid/app/src/main/java/com/example/poolguide/GuideOverlayView.kt "$DEST/"

          cp PoolGuideAndroid/app/src/main/java/com/example/poolguide/PoolAnalysisEngine.kt "$DEST/"
          cp "PoolGuideAndroid/app/src/main/java/com/example/poolguide/PoolPhysics.kt." "$DEST/PoolPhysics.kt"
          cp PoolGuideAndroid/app/src/main/java/com/example/poolguide/TableDetector.kt "$DEST/"

          cp BallDetector.kt "$DEST/"
          cp TrajectoryCalculator.kt "$DEST/"

          cp PoolGuideAndroid/app/src/main/AndroidManifest.xml source/PoolGuideAndroid/app/src/main/AndroidManifest.xml

      - name: Comprobar archivos incorporados
        run: |
          DEST="source/PoolGuideAndroid/app/src/main/java/com/example/poolguide"
          echo "Archivos Kotlin incorporados:"
          ls -la "$DEST"
          test -f "$DEST/BallDetector.kt"
          test -f "$DEST/TrajectoryCalculator.kt"
          test -f "$DEST/PoolAnalysisEngine.kt"
          test -f "$DEST/PoolPhysics.kt"
          test -f "$DEST/MainActivity.kt"
          test -f "$DEST/ScreenCaptureService.kt"
          test -f "$DEST/GuideOverlayView.kt"
          test -f "$DEST/TableDetector.kt"

      - name: Corregir compatibilidad Java
        run: |
          cat >> source/PoolGuideAndroid/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Comprobar estructura Gradle
        run: |
          set -e
          test -f source/PoolGuideAndroid/settings.gradle
          test -f source/PoolGuideAndroid/build.gradle
          test -f source/PoolGuideAndroid/app/build.gradle
          test -f source/PoolGuideAndroid/app/src/main/AndroidManifest.xml

      - name: Compilar APK
        run: |
          cd source/PoolGuideAndroid
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolGuide-APK
          path: source/PoolGuideAndroid/app/build/outputs/apk/debug/*.apk
          
