
name: Build Pool Guide APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir source
          unzip *.zip -d source

                - name: Aplicar nuevo MainActivity
        run: |
          cp PoolGuideAndroid/app/src/main/java/com/example/poolguide/MainActivity.kt source/PoolGuideAndroid/app/src/main/java/com/example/poolguide/MainActivity.kt

      - name: Corregir compatibilidad Java
        run: |
          cat >> source/PoolGuideAndroid/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Comprobar configuración
        run: |
          find source/PoolGuideAndroid -name 'build.gradle*' -type f -print
          grep -RniE 'sourceCompatibility|targetCompatibility|jvmTarget' source/PoolGuideAndroid --include='*.gradle' --include='*.gradle.kts' || true

      - name: Compilar APK
        run: |
          cd source/PoolGuideAndroid
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolGuide-APK
          path: source/PoolGuideAndroid/app/build/outputs/apk/debug/*.apk

