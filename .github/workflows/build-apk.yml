
name: Build Pool Guide APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir source
          unzip *.zip -d source
      - name: Ajustar Java a 17
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' source/PoolGuideAndroid/app/build.gradle
            - name: Comprobar configuración Java
        run: |
          find source/PoolGuideAndroid -name 'build.gradle*' -type f -print
          grep -RniE 'sourceCompatibility|targetCompatibility|jvmTarget|VERSION_1_8|VERSION_17|jvmToolchain' source/PoolGuideAndroid --include='*.gradle' --include='*.gradle.kts' || true name: Compilar APK
        run: |
          cd source/PoolGuideAndroid
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolGuide-APK
          path: source/PoolGuideAndroid/app/build/outputs/apk/debug/*.apk
          
