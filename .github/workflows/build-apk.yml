name: Build Pool Guide APK

on:
  push:
    branches:
      - fix/poolguide-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify standalone project
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/poolguide/MainActivity.kt
          test -f app/src/main/java/com/example/poolguide/ScreenCaptureService.kt
          test -f app/src/main/java/com/example/poolguide/FloatingOverlayService.kt
          test -f app/src/main/java/com/example/poolguide/GuideOverlayView.kt
          test -f app/src/main/java/com/example/poolguide/BallDetector.kt
          test -f app/src/main/java/com/example/poolguide/TableDetector.kt
          test -f app/src/main/java/com/example/poolguide/TrajectoryCalculator.kt
          test -f app/src/main/java/com/example/poolguide/PoolPhysics.kt
          test -f app/src/main/java/com/example/poolguide/PoolAnalysisEngine.kt

      - name: Compile debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolGuide-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
